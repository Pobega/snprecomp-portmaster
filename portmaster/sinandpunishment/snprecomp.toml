# Sin and Punishment Recompiled - Handheld Configuration
# Tuned for Anbernic RG34XX SP / RGSP (720x480 3:2, Allwinner H700)

[video]
# Aspect ratio: "expand" (3:2 720x480 full screen) or "original" (4:3 pillarboxed)
aspect_ratio = "expand"
# Resolution scale: 2 (native 480p match for H700) or 1 (original 240p)
resolution_scale = 2
vsync = true
target_fps = 60
sharp_textures = false
sharp_hud = true

[audio]
master_volume = 100
music_volume = 100
sfx_volume = 100

[controls]
# Scheme:
#   "dpad_strafe_shift"  - Stickless: Strafe + Shift (Default): D-Pad strafes, Hold L1/L2 + D-Pad aims (X recenters/switches), A/R1/R2 fire, B jump, Y roll
#   "bumper_strafe"      - Stickless: Bumper Strafe: D-Pad aims, L1/R1 strafe, A/Y/R2 fire/sword, B jump, X/L2 lock-on
#   "face_strafe"        - Stickless: Face Strafe: D-Pad aims, Y/B strafe, A roll, R1/R2 fire, L1/X jump, L2 lock-on
#   "dpad_aim"           - Legacy: D-Pad Aim: D-Pad aims, Y/A strafe, R1/R2 fire, L1 jump, B/L2 roll, X lock-on
#   "dpad_strafe"        - Legacy: Face Aim: D-Pad strafes, Face diamond (X/B/Y/A) aims, R1 fire, L1 jump, L2 roll, R2 lock-on
#   "twin_stick"         - Twin Stick: Left stick strafes, Right stick aims, R1/R2 fire, L1/L2 jump, X roll, A lock-on
scheme = "dpad_strafe_shift"
# Smart Lock-On: "auto" (Stickless default: always lock, hold to manual aim), "hold" (hold button to lock), "off" (N64 toggle)
smart_lock_on = "auto"
# Aim Curve: "s_curve" (fine tap precision + smooth ramp), "linear"
aim_curve = "s_curve"
# Face button layout:
#   "positional" - Maps SDL East(B)->A, South(A)->B, North(Y)->X, West(X)->Y (matches NextUI PORTS.pak default xbox controllerDB)
#   "nintendo"   - Direct SDL A->A, B->B, X->X, Y->Y (use if PORTS-portmaster/nintendo swap is enabled)
face_layout = "positional"
stick_sensitivity = 100.0
deadzone = 0.15
analog_aim = true
rumble = true
swap_sticks = false

[cheats]
unlock_options = false
infinite_health = false
infinite_time = false
infinite_continues = false
max_score = false
invincible = false
infinite_air_jumps = false

[rom]
# Preferred ROM region: "auto" (prefers English if present, else Japanese), "en", or "jp"
preferred_region = "auto"
